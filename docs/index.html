<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>exotui desktop</title>
    <style>
    :root {
      color-scheme: dark;
      background: #0a0c14;
      color: #e2e8f4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #app {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      outline: none;
      touch-action: none;
      user-select: none;
      background: #0a0c14;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
    }
    </style>
  </head>
  <body>
    <div id="app" aria-label="exotui desktop demo"></div>
    <script type="module" src="./assets/desktop.js"></script>
  </body>
</html>
